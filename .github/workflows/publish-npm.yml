name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify release tag and package.json manifest parity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.name !== "n8n-nodes-remove-ac") {
              throw new Error(`Unexpected package.json name: ${pkg.name}`);
            }
            if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(pkg.version || "")) {
              throw new Error(`Invalid package.json semver version: ${pkg.version}`);
            }
            const expectedRepoUrl = "git+https://github.com/szp2005/n8n-nodes-remove-ac.git";
            if (pkg.repository?.url !== expectedRepoUrl) {
              throw new Error(`Unexpected repository.url: ${pkg.repository?.url} !== ${expectedRepoUrl}`);
            }

            const requiredFiles = [
              pkg.main,
              ...(pkg.n8n?.credentials || []),
              ...(pkg.n8n?.nodes || []),
            ];
            for (const relPath of requiredFiles) {
              if (!relPath || !fs.existsSync(relPath)) {
                throw new Error(`Missing required package artifact declared in package.json: ${relPath}`);
              }
            }

            const eventName = process.env.EVENT_NAME || "";
            const releaseTag = (process.env.RELEASE_TAG || "").trim();
            if (eventName === "release") {
              if (!/^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(releaseTag)) {
                throw new Error(`Unsupported release tag format for npm publish: ${releaseTag}`);
              }
              const expectedTag = `v${pkg.version}`;
              if (releaseTag !== expectedTag) {
                throw new Error(`Release tag ${releaseTag} does not match package.json version ${expectedTag}`);
              }
            }
            console.log(`Verified ${pkg.name}@${pkg.version} (event=${eventName || "local"}${releaseTag ? `, tag=${releaseTag}` : ""})`);
          '

      - name: Run n8n node unit & security tests
        run: npm test

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          set -euo pipefail
          check_npm_ver() {
            node -e '
              const m = /^(\d+)\.(\d+)\.(\d+)/.exec(process.argv[1] || "");
              if (!m) process.exit(1);
              const maj = Number(m[1]);
              const min = Number(m[2]);
              const pat = Number(m[3]);
              const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
              process.exit(ok ? 0 : 1);
            ' "$1"
          }
          NPM_VER="$(npm --version)"
          echo "Detected npm version: ${NPM_VER}"
          if ! check_npm_ver "$NPM_VER"; then
            npm install -g "npm@^11.6.0"
            hash -r
            NPM_VER="$(npm --version)"
            echo "Upgraded npm version: ${NPM_VER}"
            check_npm_ver "$NPM_VER"
          fi

      - name: Publish n8n-nodes-remove-ac to npmjs.org (OIDC Trusted Publisher or NPM_TOKEN)
        env:
          NPM_TOKEN_OPT: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TEMP_NPMRC=""
          cleanup() {
            local rc=$?
            if [ -n "${TEMP_NPMRC:-}" ] && [ -f "$TEMP_NPMRC" ]; then
              rm -f "$TEMP_NPMRC"
            fi
            return "$rc"
          }
          trap cleanup EXIT
          if [ -n "${NPM_TOKEN_OPT:-}" ]; then
            echo "Using configured secrets.NPM_TOKEN for npmjs.org authentication."
            umask 077
            TEMP_NPMRC="$(mktemp)"
            chmod 600 "$TEMP_NPMRC"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN_OPT" > "$TEMP_NPMRC"
            unset NODE_AUTH_TOKEN
            export NPM_CONFIG_USERCONFIG="$TEMP_NPMRC"
          else
            echo "Using GitHub Actions OIDC Trusted Publisher for npmjs.org authentication."
            unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          fi
          set +e
          PUBLISH_OUT="$(npm publish --provenance --access public --registry=https://registry.npmjs.org 2>&1)"
          PUBLISH_RC=$?
          set -e
          printf '%s\n' "$PUBLISH_OUT"
          if [ "$PUBLISH_RC" -ne 0 ]; then
            if printf '%s\n' "$PUBLISH_OUT" | grep -Eqi "EPUBLISHCONFLICT|409 Conflict|cannot publish over existing version|You cannot publish over the previously published versions"; then
              echo "Version already published on npmjs.org; treating as idempotent skip."
              exit 0
            fi
            echo "::error::npmjs.org publish failed with exit code ${PUBLISH_RC}"
            exit "$PUBLISH_RC"
          fi
